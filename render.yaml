databases:
  - name: polla-mundialista-db
    plan: free
    databaseName: polla_mundialista_saas
    user: polla_mundialista

services:
  - type: web
    name: polla-mundialista-pro
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm prisma generate && pnpm prisma migrate deploy && pnpm build
    startCommand: pnpm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: polla-mundialista-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: NODE_ENV
        value: production
