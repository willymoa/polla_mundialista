# Nota: el plan free de Render permite solo 1 base de datos PostgreSQL por cuenta.
# Si ya tienes una, NO declares "databases" aquí. Copia la Internal Database URL
# de tu Postgres existente en Render y configúrala como DATABASE_URL al desplegar.
# Si necesitas crear BD nueva, usa render.with-database.yaml (y elimina tu otra BD free).

services:
  - type: web
    name: polla-mundialista-pro
    runtime: node
    plan: free
    branch: master
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm prisma generate && pnpm prisma migrate deploy && pnpm build
    startCommand: pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: NODE_ENV
        value: production
