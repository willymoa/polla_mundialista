# Usar solo si tu cuenta Render NO tiene otra base de datos free activa.
# Renombra a render.yaml o crea el Blueprint apuntando a este archivo.

databases:
  - name: polla-mundialista-db
    plan: free
    databaseName: polla_mundialista_saas
    user: polla_mundialista

services:
  - type: web
    name: polla-mundialista-pro
    runtime: node
    plan: free
    branch: master
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm prisma generate && pnpm prisma migrate deploy && pnpm build
    startCommand: pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: polla-mundialista-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: NODE_ENV
        value: production
